name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install System Gradle & Generate Missing Wrapper
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          # إذا كان ملف التشغيل مفقوداً، نقوم بتوليده تلقائياً
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper jar missing, generating..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace || true

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/OfflineScreenTranslator-debug.apk || true
          cp app/build/outputs/apk/release/*.apk artifacts/OfflineScreenTranslator-release-unsigned.apk || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OfflineScreenTranslator-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
