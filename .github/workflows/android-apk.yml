name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/OfflineScreenTranslator-debug.apk
          cp app/build/outputs/apk/release/*.apk artifacts/OfflineScreenTranslator-release-unsigned.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OfflineScreenTranslator-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
